# kb3lyb-sway baked foot defaults. foot is the interim terminal until ghostty
# (DESIGN §2) is layered from a vetted COPR. foot is Wayland-native and sharp at
# fractional scale (DESIGN §4). System fallback; real config via stow.
# dpi-aware=no: size the font from the compositor's fractional scale (1.35 on the
# Framework panel) like every other Wayland app, instead of the panel's raw ~201
# physical DPI — otherwise foot renders ~1.5x larger than Firefox et al.
font=monospace:size=11
dpi-aware=no

[cursor]
blink=yes

[colors]
# Opaque: transparency triggers a red garbled band at the window bottom on this
# AMD APU (niri alpha-blends every frame). Same fix as ghostty. It's a tiling WM.
alpha=1.0
background=1a1b26
foreground=c0caf5
