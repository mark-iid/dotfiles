[Settings]
# GTK4 non-libadwaita apps. (Pure-libadwaita apps ignore this and follow the
# portal color-scheme instead — that path needs xdg-desktop-portal running.)
#
# Deliberately NO gtk-theme-name here. GTK4 ships only a "Default" theme; there is
# no Adwaita on disk. libadwaita sets gtk-theme-name to its own "Adwaita-empty"
# sentinel and supplies the stylesheet itself, so naming a theme here can only
# lose that. (libadwaita also warns that prefer-dark is unsupported — it is kept
# for plain-GTK4 apps like HandBrake, which have no AdwStyleManager.)
gtk-application-prefer-dark-theme=1
