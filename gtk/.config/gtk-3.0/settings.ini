[Settings]
# niri has no settings daemon, so name the theme and the dark preference directly.
# GTK3 apps (Thunar, Evolution, nm-connection-editor, gtklock, Firefox's GTK
# chrome) read this at startup.
#
# The theme MUST be "Adwaita", not "Adwaita-dark". GTK3 has Adwaita compiled in
# (/org/gtk/libgtk/theme/Adwaita) but there is no Adwaita-dark on disk — naming it
# fails the lookup and GTK3 silently falls back to LIGHT even with prefer-dark set.
# Verified: theme-name=Adwaita-dark -> bg rgb(246,245,244); Adwaita -> rgb(53,53,53).
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita

# Recent-files tracking off. GTK's GtkRecentManager is what writes
# ~/.local/share/recently-used.xbel — every file opened or saved through a GTK
# file dialog, with full paths and timestamps. GTK3 honours all three of these
# (verified present in libgtk-3.so.0); -enabled is the switch, the other two are
# belt-and-braces in case an app pokes the manager directly.
#
# This stops the WRITER, not the file. The backstop that stops anything else
# writing it is private-history.service (dotfiles systemd/), which points that
# path at /dev/null.
#
# COST: the "Recent" list in every GTK file dialog goes empty, and so does
# Thunar's Recent sidebar entry. Bookmarks and the sidebar's normal places are
# unaffected.
gtk-recent-files-enabled=0
gtk-recent-files-limit=0
gtk-recent-files-max-age=0
