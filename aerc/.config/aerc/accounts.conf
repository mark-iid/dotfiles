# Personal mail — mark@mystikos.org (MXroute). The password is fetched from rbw
# (Bitwarden) at startup via *-cred-cmd, so nothing is stored on disk here. Unlock
# rbw once (pinentry) and it stays cached; aerc then connects without prompting.
[mystikos]
from              = Mark Earnest <mark@mystikos.org>
source            = imaps://mark%40mystikos.org@mail.mystikos.org:993
source-cred-cmd   = /home/linuxbrew/.linuxbrew/bin/rbw get "mxroute email"
outgoing          = smtps://mark%40mystikos.org@mail.mystikos.org:465
outgoing-cred-cmd = /home/linuxbrew/.linuxbrew/bin/rbw get "mxroute email"
copy-to           = Sent

# OpenPGP via system gpg (key A43D2D67AF8797B1 = mark@mystikos.org)
pgp-key-id                = A43D2D67AF8797B1
pgp-auto-sign             = true
pgp-opportunistic-encrypt = true
