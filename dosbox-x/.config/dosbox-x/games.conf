# games.conf -- DOSBox-X profile for playing DOS games.
#
# C: is ~/dosgames, mounted READ-WRITE with no overlay. That is deliberate and
# the opposite of the toolchest profile: games must write save files, config and
# high scores, and you want those kept. ~/dos (the 1994 archive) is not mounted
# here at all, so nothing you install can wander into it.
#
# Per-game tuning is the norm, not a sign something is wrong:
#   dosdev games --cycles 3000     pre-1990 titles that run absurdly fast
#   dosdev games --cycles max      late DOS / 486-era titles
#   dosdev games --machine vgaonly stricter VGA, fixes some 1991-95 games
#   dosdev games --machine tandy   Tandy 1000 graphics + 3-voice sound
#   dosdev games --machine cga     early CGA titles

[sdl]
autolock=true
fullscreen=false

[dosbox]
title=DOS Games
machine=svga_s3
memsize=16

[cpu]
core=auto
# auto adapts to what the game asks for. Override per game with --cycles.
cycles=auto

[dos]
files=40
xms=true
ems=true
umb=true

[sblaster]
# Stated explicitly rather than relying on defaults, so it is greppable later.
# This is the canonical config nearly every DOS game auto-detects, and it is
# what the guest sees as BLASTER=A220 I7 D1 H5 P330 T6.
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
oplrate=44100

[speaker]
pcspeaker=true

[joystick]
joysticktype=2axis
timed=false

[render]
aspect=true

[autoexec]
mount c "/home/mark/dosgames"
c:
cd \
cls
echo.
echo   DOS games   C: = ~/dosgames
echo.
dir /w
echo.
echo   Sound Blaster 16 at A220 I7 D1 H5, MPU-401 at 330.
echo   Speed wrong? exit and use:  dosdev games --cycles 3000  (or max)
echo.
