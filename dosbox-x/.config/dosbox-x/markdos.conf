# markdos.conf -- DOSBox-X for ~/dos
#
# C: is ~/dos with ~/dos-work layered on top as an OVERLAY. Every write the
# guest makes lands in ~/dos-work; ~/dos is never modified. This is not
# paranoia: A86 rewrites your source file in place when it hits an error and
# renames the original to .ERR, and several of these compilers drop .OBJ/.BAK
# next to their input. The overlay makes all of that harmless.
#
# To promote something you built, move it from ~/dos-work into ~/dos yourself.

[sdl]
# Windows 3.1 needs the mouse captured to receive relative motion. Click in the
# window to grab it; Ctrl+F10 releases it again.
autolock=true

[dosbox]
title=Mark's DOS
machine=svga_s3
memsize=16
# For Star Defender's authentic Tandy 1000 sound, launch with:
#   -set dosbox machine=tandy
# svga_s3 (S3 SVGA, which also runs CGA/EGA/VGA software) is correct for
# everything else here.

[cpu]
# auto: fast enough for the compilers, sane for the games. Use cycles=max
# if a full PBClone rebuild feels slow; use a fixed value if a game runs hot.
cycles=auto

[dos]
files=40
xms=true
ems=true
umb=true

[joystick]
# Star Defender reads STICK/STRIG. Without this the crosshairs will not move.
joysticktype=2axis
timed=false

[speaker]
pcspeaker=true

[render]
aspect=true

[autoexec]
mount c "/home/mark/dos"
c:
cd \
call autoexec.bat
