# gtklock — the niri session locker.
#
# A real GTK dialog: password field, username, a live clock (the "what's
# happening" indicator), and it surfaces the PAM fingerprint prompt (system-auth
# has pam_fprintd sufficient). The live clock is harmless — a verified test showed
# the panel still blanks on input idle while an animation repaints, so blanking is
# input-driven (ext-idle-notify), not damage-driven.
#
# Invoked as: gtklock -d -c ~/.config/gtklock/config.ini
[main]
style=/home/mark/.config/gtklock/style.css
time-format=%H:%M:%S
date-format=%A %e %B %Y
