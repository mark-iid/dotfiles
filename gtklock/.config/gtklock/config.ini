# gtklock — the niri session locker (replaces swaylock).
#
# Chosen over swaylock because swaylock is a bare ring with no field/label and no
# usable fingerprint UX. gtklock is a real GTK dialog: password field, username, a
# live clock (= the "what's happening" indicator), and it surfaces the PAM
# fingerprint prompt (system-auth has pam_fprintd sufficient). Its live clock is
# harmless — a verified test showed the panel still blanks on input-idle while an
# animation repaints, so the old "clock defeats DPMS-off" reason for swaylock was
# a misdiagnosis.
#
# Invoked as: gtklock -d -c ~/.config/gtklock/config.ini
[main]
style=/home/mark/.config/gtklock/style.css
time-format=%H:%M:%S
date-format=%A %e %B %Y
